spring.application.name=login-app

# ---------------------------------------------------
# MySQL configuration (default)
# ---------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/login_app_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=NeymarLM10$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------
# To use Postgres instead:
#   1) Add the postgresql dependency in pom.xml (see comment there)
#   2) Comment out the MySQL properties above and uncomment below
# ---------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/login_app_db
# spring.datasource.username=postgres
# spring.datasource.password=your_postgres_password
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# For Postgres, also set:
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# ---------------------------------------------------
# JWT settings
# ---------------------------------------------------
# IMPORTANT: replace this with a long, random, secret value in production
# (must be at least 256 bits / 32 chars for HS256)
app.jwt.secret=change_this_to_a_long_random_secret_key_minimum_32_characters
app.jwt.expiration-ms=86400000
